<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{ book_title }} — Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/site.css" />
  <link rel="stylesheet" href="/static/css/page-flip.css" />
  <link rel="stylesheet" href="/static/css/reader.css?v=mobile1" />
</head>
<body class="reader-body" data-viewer="{{ viewer_id }}" data-token="{{ stream_token }}">
  <div id="shield" class="shield" hidden>Return to this tab to continue reading</div>
  <header class="reader-bar">
    <a class="back" href="/">←</a>
    <div class="titles">
      <strong>{{ book_title }}</strong>
      <span>{{ author }}</span>
    </div>
    <div class="controls">
      <button type="button" id="zoom-out" title="Smaller">−</button>
      <button type="button" id="zoom-in" title="Larger">+</button>
      <span id="page-ind">Opening…</span>
      <button type="button" id="prev" title="Previous page">‹</button>
      <button type="button" id="next" title="Next page">›</button>
      <button type="button" id="toggle-side" class="side-toggle" title="Index &amp; jump">☰</button>
    </div>
  </header>

  <div class="reader-layout">
    <div class="stage">
      <div id="book-shell" class="book-shell">
        <div id="book"></div>
        <div id="wm" class="wm" aria-hidden="true"></div>
      </div>
      <p class="hint">Drag a corner, click the page, or use the arrows — it turns like a book</p>
    </div>

    <button type="button" id="side-backdrop" class="side-backdrop" aria-label="Close panel" hidden></button>
    <aside id="side" class="side-panel" aria-label="Index and navigation">
      <div class="side-block">
        <h3>Jump to page</h3>
        <form id="jump-form" class="jump-form" autocomplete="off">
          <input id="page-jump" type="number" min="1" inputmode="numeric" placeholder="Page #" aria-label="Page number" />
          <button type="submit" class="btn-side">Go</button>
        </form>
      </div>

      <div class="side-block">
        <h3>Your place</h3>
        <p class="meta"><span>Now</span> <strong id="now-page">—</strong></p>
        <p class="meta"><span>Last read</span> <strong id="last-page">—</strong></p>
        <p class="meta"><span>Progress</span> <strong id="progress-label">0%</strong></p>
        <div class="progress"><i id="progress-bar"></i></div>
        <button type="button" id="resume-btn" class="btn-side wide">Resume last page</button>
      </div>

      <div class="side-block side-index">
        <h3>Index</h3>
        <nav id="index-list" class="index-list"></nav>
      </div>
    </aside>
  </div>

  <p class="reader-foot">
    Protected view · ID {{ viewer_id }} ·
    Copying &amp; printing disabled
  </p>
  <script src="/static/js/page-flip.browser.js"></script>
  <script type="module" src="/static/js/reader.js?v=firebase1"></script>
</body>
</html>
